<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Works - E-Visit Intake</title>
  <link rel="stylesheet" href="../styles/platform-theme.css">
</head>
<body>
  <div class="intake-container">
    <header class="intake-header">
      <h2>Health Works Intake</h2>
      <p class="price-tag">Pilot Rate: $99 (Standard $150)</p>
    </header>

    <form id="health-form">
      <div class="form-group">
        <label for="client-name">Full Legal Name *</label>
        <input type="text" id="client-name" name="clientName" required>
      </div>

      <div class="form-group">
        <label for="client-dob">Date of Birth *</label>
        <input type="date" id="client-dob" name="clientDob" required>
      </div>

      <div class="form-group">
        <label for="client-email">Email Address *</label>
        <input type="email" id="client-email" name="clientEmail" required>
      </div>

      <div class="form-group">
        <label for="service-type">Requested Service *</label>
        <select id="service-type" name="serviceType" required>
          <option value="med-refill">Maintenance Medication Refill ($99)</option>
          <option value="esa-letter">ESA Renewal Letter ($99)</option>
          <option value="housing-letter">Housing Accommodation Letter ($99)</option>
          <option value="absence-note">Medical Absence Note ($99)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="clinical-notes">Notes / Medication Details *</label>
        <textarea id="clinical-notes" name="clinicalNotes" rows="3" required></textarea>
      </div>

      <div class="identity-block">
        <h3>Identity Verification</h3>
        <p class="subtext">Upload a clear photo of your government-issued ID for verification.</p>

        <div class="form-group">
          <label for="id-upload">Government ID Photo *</label>
          <input type="file" id="id-upload" name="idPhoto" accept="image/*,.pdf" required>
        </div>
      </div>

      <div class="attestation-block">
        <h3>Attestation & Consent</h3>

        <div class="form-group checkbox-group">
          <label for="attest-truth">
            <input type="checkbox" id="attest-truth" name="attestTruth" required>
            I attest that all information provided is accurate and truthful to the best of my knowledge.
          </label>
        </div>

        <div class="form-group checkbox-group">
          <label for="attest-terms">
            <input type="checkbox" id="attest-terms" name="attestTerms" required>
            I understand that submission does not guarantee approval and that review fees are non-refundable once evaluated.
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit Request →</button>
    </form>
  </div>

  <script type="module">
    import { submitIntake } from '../engine/route-intake.js';

    const form = document.getElementById('health-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {
        clientName: formData.get('clientName'),
        clientEmail: formData.get('clientEmail'),
        clientDob: formData.get('clientDob'),
        answers: {
          serviceType: formData.get('serviceType'),
          clinicalNotes: formData.get('clinicalNotes'),
          idPhoto: formData.get('idPhoto')
        },
        attestations: {
          attestTruth: formData.get('attestTruth') === 'on',
          attestTerms: formData.get('attestTerms') === 'on'
        }
      };

      const config = {
        memberId: 'HEALTH-001',
        vertical: 'HEALTH',
        googleVaultUrl: 'https://script.google.com/macros/d/YOUR_DEPLOYMENT_ID/usercontent',
        supabaseLedgerUrl: 'https://YOUR_SUPABASE_URL/rest/v1/requests'
      };

      try {
        const result = await submitIntake(data, config);
        if (result.success) {
          alert(`✓ Submission successful!\nRequest ID: ${result.requestId}`);
          form.reset();
        } else {
          alert(`✗ Submission failed: ${result.error}`);
        }
      } catch (error) {
        console.error('Form submission error:', error);
        alert('An error occurred during submission.');
      }
    });
  </script>
</body>
</html>
